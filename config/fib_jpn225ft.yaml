# JPN225ft fibonacci retrace preset (index, account 2).
# strategy: donchian — the 6-month backtest (scripts/backtest_all.py) showed
# breakout beating the fib pullback on this symbol. File keeps its fib_ name
# so start.bat and the magic_number stay stable.
# Inherits all other defaults from src/gold_trader/config.py.
symbol: JPN225ft
timeframe: H1
strategy: donchian

risk:
  per_trade_pct: 0.3
  atr_stop_mult: 2.0
  max_positions: 1

filters:
  atr_pct_min: 0.0005
  atr_pct_max: 0.05

daily_guard:
  max_consecutive_losses: 2
  max_loss_pct: 2.0

session:
  trade_days: [Mon, Tue, Wed, Thu, Fri]

execution:
  magic_number: 20260515
  deviation_points: 30
  comment: "fib_jpn225ft"

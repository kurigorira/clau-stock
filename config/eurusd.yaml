# Inherits defaults from src/gold_trader/config.py.
# See config/example.yaml for the full list of tunable parameters.

symbol: EURUSD
timeframe: H1

filters:
  # FX ATR/close is typically 0.01-0.03% on H1; the default 0.1% floor would
  # block almost every bar, so loosen this single knob for FX pairs only.
  atr_pct_min: 0.0001

session:
  trade_days: [Mon, Tue, Wed, Thu, Fri]

execution:
  magic_number: 20260511
  deviation_points: 10
  comment: "eurusd_breakout"

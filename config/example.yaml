symbol: BTCUSD
timeframe: H1

trend:
  ema_length: 200
  ema_slope_lookback: 10        # bars compared against current EMA for slope sign

breakout:
  donchian_length: 20
  exit_donchian_length: 10
  atr_buffer_mult: 0.1          # close must clear donchian by this * ATR to enter

risk:
  per_trade_pct: 0.5            # %% of equity risked per trade
  atr_length: 14
  atr_stop_mult: 2.0
  max_positions: 1

filters:
  adx_length: 14
  adx_min: 20.0                 # minimum ADX for a trending regime
  atr_pct_min: 0.004            # 0.4%%: skip dead-flat sessions
  atr_pct_max: 0.025            # 2.5%%: skip extreme-vol blowoffs

daily_guard:
  max_consecutive_losses: 2     # block entries after N losing closes today
  max_loss_pct: 1.0             # block entries when realized loss today >= this %% of equity

session:
  # BTC trades 24/7; keep the keys present so the session filter is a no-op.
  start_utc: "00:00"
  end_utc: "23:59"
  trade_days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]

execution:
  magic_number: 20260509
  deviation_points: 20
  poll_seconds: 30
  comment: "btc_breakout"
